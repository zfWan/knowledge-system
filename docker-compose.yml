version: "3.9"

services:
  server:
    build: ./server
    container_name: knowledge-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:./data/app.db
      STORAGE_LOCAL_ROOT: ./data/uploads
    volumes:
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    container_name: knowledge-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  data:
